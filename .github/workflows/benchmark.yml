name: Benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    # 128 GB host: upstream's accepted run peaked at 90.25 GiB RSS, with strict replay under a
    # 112 GiB cap and author stages under 64 GiB each. Candidate proof scripts run only inside the
    # verifier's Bubblewrap sandbox, so the verifier runs on the runner itself.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    # scripts/run.py caps the verifier at 1,260 minutes; upstream's accepted run took 653 minutes.
    # A cold setup builds Poly/ML, two HOL4 trees and the baseline theories, so official runs rely
    # on the cache that warm-cache.yml saves on main. Stay under the 24-hour job token.
    timeout-minutes: 1380
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Runner resources
        run: nproc; free -g; df -h "${GITHUB_WORKSPACE}"; uname -r; command -v python3
      # Ubuntu 24.04's AppArmor policy denies unprivileged user namespaces, which the verifier's
      # author sandbox (and setup's check of it) creates through bwrap. The runner is an ephemeral single-job VM, and the
      # Bubblewrap sandbox itself is unchanged.
      - name: Allow Bubblewrap user namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            work/polyml
            work/polyml.rev
            work/HOL
            work/HOL.rev
            work/HOL-export
            work/HOL-export.rev
            .build
          key: hol-verifier-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('provenance.json', 'holproject.toml', '.gitmodules', 'challenge/**', 'source/**', 'experiments/**', 'verifier/**', 'tools/**', 'scripts/setup.sh') }}-v1
      - name: Setup
        run: bash scripts/setup.sh
      # Save trusted builds before candidate verification, even if the proof fails.
      # Only the default branch publishes caches shared with submission branches.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        with:
          path: |
            work/polyml
            work/polyml.rev
            work/HOL
            work/HOL.rev
            work/HOL-export
            work/HOL-export.rev
            .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Benchmark
        run: python3 scripts/run.py
      # Reads the current record from Yukon's public API.
      - name: Add verification time to the score
        env:
          YUKON_API_URL: ${{ vars.YUKON_API_URL }}
        run: python3 scripts/time_score.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-score
          path: scripts/score.json
          if-no-files-found: error
      # Stage logs and replay evidence only; the generated article stays on the runner.
      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifier-logs
          path: |
            work/yukon/*/*.log
            work/yukon/*/generated-package.json
            work/yukon/*/strict-replay/replay.log
            work/yukon/*/strict-replay/replay-process.json
          if-no-files-found: ignore
