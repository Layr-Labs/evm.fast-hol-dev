name: Warm verifier cache
# Yukon dispatches benchmark.yml on baseline and submission branches. Those runs can restore
# caches saved on the default branch but never save their own, so this workflow publishes the
# trusted build from main. Submissions hit only while main's key inputs match the benchmark's
# imported commit. Rewarm after eviction with `gh workflow run warm-cache.yml --ref main`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - provenance.json
      - holproject.toml
      - .gitmodules
      - "challenge/**"
      - "source/**"
      - "experiments/**"
      - "verifier/**"
      - "tools/**"
      - scripts/setup.sh
      - .github/workflows/warm-cache.yml
permissions:
  contents: read
concurrency:
  group: warm-verifier-cache
  cancel-in-progress: false
jobs:
  warm:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: blacksmith-32vcpu-ubuntu-2404
    # A cold setup builds Poly/ML, two HOL4 trees, the baseline theories and the verifier heap.
    # Stay under the 24-hour job token.
    timeout-minutes: 1380
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Submissions restore with the key computed in benchmark.yml; a different key here would
      # publish an entry nobody reads.
      - name: Cache key matches benchmark.yml
        run: |
          key() { grep -m1 -E '^ +key: hol-verifier-' "$1" | sed -E 's/^ +//'; }
          test -n "$(key .github/workflows/benchmark.yml)"
          test "$(key .github/workflows/benchmark.yml)" = "$(key .github/workflows/warm-cache.yml)"
      - name: Runner resources
        run: nproc; free -g; df -h "${GITHUB_WORKSPACE}"; uname -r
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            work/polyml
            work/polyml.rev
            work/HOL
            work/HOL.rev
            work/HOL-export
            work/HOL-export.rev
            .build
          key: hol-verifier-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('provenance.json', 'holproject.toml', '.gitmodules', 'challenge/**', 'source/**', 'experiments/**', 'verifier/**', 'tools/**', 'scripts/setup.sh') }}-v1
      # Same reason as benchmark.yml: setup checks both HOL trees inside the verifier's bwrap sandbox.
      - name: Allow Bubblewrap user namespaces
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Setup
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash scripts/setup.sh
      - name: Cache size
        if: steps.cache.outputs.cache-hit != 'true'
        run: du -sh work/polyml work/HOL work/HOL-export .build
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            work/polyml
            work/polyml.rev
            work/HOL
            work/HOL.rev
            work/HOL-export
            work/HOL-export.rev
            .build
          key: ${{ steps.cache.outputs.cache-primary-key }}
